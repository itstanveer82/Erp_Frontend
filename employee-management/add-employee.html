<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Employee - Attendance & Payroll ERP</title>

    <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin-dashboard.css">
    <link rel="stylesheet" href="../css/add-employee.css">
</head>

<body>

    <div class="container-fluid py-4">

        <!-- Page Header -->
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">

            <div>
                <h2 class="mb-1" id="employeeFormTitle">
                    Add Employee
                </h2>

                <p class="text-muted mb-0" id="employeeFormSubTitle">
                    Create a new employee record
                </p>
            </div>

            <a href="employee.html" class="btn btn-outline-secondary">
                Back to Employees
            </a>

        </div>


        <!-- Employee Form -->
        <div class="card shadow-sm">

            <div class="card-body">

                <form id="employeeForm" novalidate>

                    <div class="row g-3">

                        <!-- Employee ID -->
                        <div class="col-12 col-md-6">

                            <label for="employeeId" class="form-label">
                                Employee ID
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="employeeId"
                                placeholder="Enter employee ID"
                                required
                            >

                            <div
                                id="employeeIdError"
                                class="text-danger small mt-1">
                            </div>

                        </div>


                        <!-- Full Name -->
                        <div class="col-12 col-md-6">

                            <label for="employeeName" class="form-label">
                                Full Name
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="employeeName"
                                placeholder="Enter full name"
                                required
                            >

                            <div
                                id="employeeNameError"
                                class="text-danger small mt-1">
                            </div>

                        </div>


                        <!-- Email -->
                        <div class="col-12 col-md-6">

                            <label for="employeeEmail" class="form-label">
                                Email Address
                            </label>

                            <input
                                type="email"
                                class="form-control"
                                id="employeeEmail"
                                placeholder="Enter email address"
                                required
                            >

                            <div
                                id="employeeEmailError"
                                class="text-danger small mt-1">
                            </div>

                        </div>


                        <!-- Phone -->
                        <div class="col-12 col-md-6">

                            <label for="employeePhone" class="form-label">
                                Phone No.
                            </label>

                            <input
                                type="tel"
                                class="form-control"
                                id="employeePhone"
                                placeholder="Enter phone number"
                                required
                            >

                            <div
                                id="employeePhoneError"
                                class="text-danger small mt-1">
                            </div>

                        </div>


                        <!-- Department -->
                        <div class="col-12 col-md-6">

                            <label for="employeeDepartment" class="form-label">
                                Department
                            </label>

                            <select
                                class="form-select"
                                id="employeeDepartment"
                                required
                            >

                                <option value="">
                                    -- Select Department --
                                </option>

                                <option value="IT">
                                    IT
                                </option>

                                <option value="HR">
                                    HR
                                </option>

                                <option value="Finance">
                                    Finance
                                </option>

                                <option value="Sales">
                                    Sales
                                </option>

                            </select>

                            <div
                                id="employeeDepartmentError"
                                class="text-danger small mt-1">
                            </div>

                        </div>


                        <!-- Designation -->
                        <div class="col-12 col-md-6">

                            <label for="employeeDesignation" class="form-label">
                                Designation
                            </label>

                            <select
                                class="form-select"
                                id="employeeDesignation"
                                required
                            >

                                <option value="">
                                    -- Select Designation --
                                </option>

                                <option value="Developer">
                                    Developer
                                </option>

                                <option value="HR Manager">
                                    HR Manager
                                </option>

                                <option value="Finance Manager">
                                    Finance Manager
                                </option>

                                <option value="Sales Executive">
                                    Sales Executive
                                </option>

                            </select>

                            <div
                                id="employeeDesignationError"
                                class="text-danger small mt-1">
                            </div>

                        </div>


                        <!-- Status -->
                        <div class="col-12 col-md-6">

                            <label for="employeeStatus" class="form-label">
                                Status
                            </label>

                            <select
                                class="form-select"
                                id="employeeStatus"
                                required
                            >

                                <option value="">
                                    -- Select Status --
                                </option>

                                <option value="ACTIVE">
                                    Active
                                </option>

                                <option value="INACTIVE">
                                    Inactive
                                </option>

                            </select>

                            <div
                                id="employeeStatusError"
                                class="text-danger small mt-1">
                            </div>

                        </div>


                        <!-- Joining Date -->
                        <div class="col-12 col-md-6">

                            <label for="joiningDate" class="form-label">
                                Joining Date
                            </label>

                            <input
                                type="date"
                                class="form-control"
                                id="joiningDate"
                                required
                            >

                            <div
                                id="joiningDateError"
                                class="text-danger small mt-1">
                            </div>

                        </div>


                        <!-- Address -->
                        <div class="col-12">

                            <label for="employeeAddress" class="form-label">
                                Address
                            </label>

                            <textarea
                                class="form-control"
                                id="employeeAddress"
                                rows="3"
                                placeholder="Enter employee address"
                            ></textarea>

                        </div>


                        <!-- Form Buttons -->
                        <div class="col-12">

                            <div class="d-flex flex-column flex-sm-row gap-2 justify-content-end">

                                <a
                                    href="employee.html"
                                    class="btn btn-outline-secondary"
                                >
                                    Cancel
                                </a>

                                <button
                                    type="submit"
                                    class="btn btn-primary"
                                    id="saveEmployeeButton"
                                >
                                    Save Employee
                                </button>

                            </div>

                        </div>

                    </div>

                </form>

            </div>

        </div>

    </div>


    <script src="../assets/js/bootstrap.bundle.min.js"></script>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/add-employee.js"></script>

</body>

</html>
